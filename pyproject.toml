[project]
name = "kverus"
version = "0.1.0"
description = "Verus Proof Code Generation via Structural Retrieval and Self-Refining Proof Synthesis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click==8.1.7",
    "langchain-chroma>=0.1.4",
    "langchain-community>=0.3.8",
    "langchain-openai>=0.2.10",
    "loguru==0.7.2",
    "ollama==0.4.7",
    "openai>=1.60.0",
    "parse==1.20.2",
    "tiktoken>=0.8.0",
    "tomlkit>=0.12.0",
    "tqdm>=4.67.1",
    "nltk >= 3.9.1",
    "langchain_text_splitters>=0.3.9",
    "langchain >= 0.3.27",
    "chardet>=5.2.0",
    "pre-commit>=4.3.0",
    "pytest>=9.0.1",
    "promex-verus",
    "httpx[socks]>=0.28.1",
    "networkx>=3.6.1",
]

[dependency-groups]
dev = ["requests>=2.32.4", "deptry>=0.23.1", "pre-commit>=4.3.0"]

[tool.uv]
index-url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"

[tool.uv.workspace]
members = ["processor/promex-verus"]

[tool.uv.sources]
promex-verus = { workspace = true }
